<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go Concurrency: Module 8</title>
<style>
  :root {
    --bg: #0B1220; --panel: #111B2E; --panel2: #16233B; --stroke: #26385C;
    --text: #E7EEF8; --text2: #A9B8D0; --muted: #6F819F; --go: #00ADD8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--stroke); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  header h1 span { color: var(--go); }
  .spacer { flex: 1; }
  button, select, input { background: var(--panel2); color: var(--text); border: 1px solid var(--stroke);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 14px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--go); }
  input[type=number] { width: 70px; }
  main { flex: 1; display: flex; min-height: 0; }
  nav { width: 260px; overflow-y: auto; border-right: 1px solid var(--stroke); padding: 8px; background: var(--panel); }
  nav a { display: block; padding: 7px 10px; border-radius: 8px; color: var(--text2); text-decoration: none; font-size: 14px; }
  nav a b { color: var(--go); margin-right: 6px; }
  nav a:hover, nav a.on { background: var(--panel2); color: var(--text); }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; min-width: 0; }
  #stage img { max-width: 100%; max-height: 100%; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.5); background: var(--panel); }
  #grid { display: none; flex: 1; overflow-y: auto; padding: 16px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; align-content: start; }
  #grid figure { margin: 0; cursor: pointer; }
  #grid img { width: 100%; border-radius: 6px; border: 1px solid var(--stroke); display: block; }
  #grid figcaption { font-size: 12px; color: var(--muted); padding-top: 4px; }
  body.grid #grid { display: grid; }
  body.grid #stage { display: none; }
  #title { color: var(--text2); font-size: 13px; }
  @media (max-width: 760px) {
    nav { display: none; }
    header { gap: 8px; }
  }
</style>
</head>
<body>
<header>
  <h1><span>GO</span> ZERO TO MASTERY · MODULE 8 · THE CONCURRENCY MODEL</h1>
  <div class="spacer"></div>
  <button id="prev" title="Previous (←)">◀</button>
  <input id="num" type="number" min="1" aria-label="Page number">
  <span id="count"></span>
  <button id="next" title="Next (→)">▶</button>
  <select id="chap" aria-label="Chapter"></select>
  <button id="mode" title="Toggle overview (g)">Overview</button>
</header>
<main>
  <nav id="toc"></nav>
  <div id="stage"><img id="page" alt=""></div>
  <div id="grid"></div>
</main>
<div style="padding:6px 16px;border-top:1px solid var(--stroke);background:var(--panel)"><span id="title"></span></div>
<script>
const PAGES = /*PAGES*/[];
const CHAPTERS = /*CHAPTERS*/[];
let i = 0;
const $ = id => document.getElementById(id);

function chapterOf(n) {
  let c = null;
  for (const ch of CHAPTERS) if (ch.page <= n) c = ch;
  return c;
}
function show(k) {
  i = Math.max(0, Math.min(PAGES.length - 1, k));
  const p = PAGES[i];
  $("page").src = p.src;
  $("page").alt = p.title;
  $("num").value = i + 1;
  $("title").textContent = `p. ${i + 1} · ${p.title}`;
  const c = chapterOf(i + 1);
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", c && a.dataset.page == c.page));
  if (c) $("chap").value = c.page;
  try { history.replaceState(null, "", "#" + (i + 1)); } catch (e) {}
  if (i + 1 < PAGES.length) { const pre = new Image(); pre.src = PAGES[i + 1].src; }
}
function init() {
  $("count").textContent = "/ " + PAGES.length;
  $("num").max = PAGES.length;
  const front = {num: "", page: 1, name: "Cover and front matter"};
  for (const c of [front, ...CHAPTERS]) {
    const a = document.createElement("a");
    a.href = "#" + c.page;
    a.dataset.page = c.page;
    a.innerHTML = (c.num ? `<b>${c.num}</b>` : "") + c.name;
    a.onclick = e => { e.preventDefault(); document.body.classList.remove("grid"); show(c.page - 1); };
    $("toc").appendChild(a);
    const o = document.createElement("option");
    o.value = c.page; o.textContent = (c.num ? c.num + "  " : "") + c.name;
    $("chap").appendChild(o);
  }
  PAGES.forEach((p, k) => {
    const f = document.createElement("figure");
    f.innerHTML = `<img loading="lazy" src="${p.src}" alt=""><figcaption>${k + 1} · ${p.title}</figcaption>`;
    f.onclick = () => { document.body.classList.remove("grid"); show(k); };
    $("grid").appendChild(f);
  });
  $("prev").onclick = () => show(i - 1);
  $("next").onclick = () => show(i + 1);
  $("num").onchange = () => show(parseInt($("num").value, 10) - 1);
  $("chap").onchange = () => show(parseInt($("chap").value, 10) - 1);
  $("mode").onclick = () => document.body.classList.toggle("grid");
  $("page").onclick = e => { const r = e.target.getBoundingClientRect(); show(e.clientX - r.left < r.width / 3 ? i - 1 : i + 1); };
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); show(i + 1); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(i - 1); }
    if (e.key === "Home") show(0);
    if (e.key === "End") show(PAGES.length - 1);
    if (e.key === "g") document.body.classList.toggle("grid");
  });
  const h = parseInt(location.hash.slice(1), 10);
  show(isNaN(h) ? 0 : h - 1);
}
init();
</script>
</body>
</html>
